<!doctype html>
<html><head><meta charset="utf-8"><title>Redirecting…</title>
<script>
  // Safety net: GitHub Pages has no SPA fallback. Send unknown paths to the app root, keeping query and hash.
  var base = location.pathname.indexOf('/Med/') === 0 ? '/Med/' : '/';
  location.replace(base + location.search + location.hash);
</script></head><body></body></html>
