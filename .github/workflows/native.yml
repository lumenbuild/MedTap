name: Native apps
# Builds the Android app (APK) and checks the iOS app compiles, on every push.
# Android: builds both apps, MedTap and TapDose. With the MEDTAP_KEYSTORE_BASE64 and MEDTAP_KEYSTORE_PASSWORD secrets
# set, they're signed releases, and on the default branch they're published as the "android" and "tapdose-android"
# releases so phones can download them.
on:
  push:
  workflow_dispatch:
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.MEDTAP_KEYSTORE_BASE64 != '' }}
      MEDTAP_VERSION_CODE: ${{ github.run_number }}
      MEDTAP_VERSION_NAME: 1.0.${{ github.run_number }}
      # The app compares its build with the latest release's to offer updates (src/app/updates.ts).
      VITE_BUILD: ${{ github.run_number }}
      VITE_APP_VERSION: build ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      # Two apps (see src/edition.ts): MedTap, then TapDose. Each needs its own web build in the app's assets first.
      - name: Build signed releases
        if: env.HAS_KEY == 'true'
        env:
          MEDTAP_KEYSTORE_PASSWORD: ${{ secrets.MEDTAP_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.MEDTAP_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/medtap.keystore"
          export MEDTAP_KEYSTORE="$RUNNER_TEMP/medtap.keystore"
          npm run build:native
          (cd android && ./gradlew --no-daemon assembleMedtapRelease)
          cp android/app/build/outputs/apk/medtap/release/app-medtap-release.apk "$RUNNER_TEMP/MedTap.apk"
          npm run build:native:tapdose
          (cd android && ./gradlew --no-daemon assembleTapdoseRelease)
          cp android/app/build/outputs/apk/tapdose/release/app-tapdose-release.apk "$RUNNER_TEMP/TapDose.apk"
      - name: Build debug (no signing key set)
        if: env.HAS_KEY != 'true'
        run: |
          npm run build:native
          (cd android && ./gradlew --no-daemon assembleMedtapDebug)
          cp android/app/build/outputs/apk/medtap/debug/app-medtap-debug.apk "$RUNNER_TEMP/MedTap-debug.apk"
          npm run build:native:tapdose
          (cd android && ./gradlew --no-daemon assembleTapdoseDebug)
          cp android/app/build/outputs/apk/tapdose/debug/app-tapdose-debug.apk "$RUNNER_TEMP/TapDose-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apps
          path: |
            ${{ runner.temp }}/MedTap*.apk
            ${{ runner.temp }}/TapDose*.apk
      - name: Publish the Android apps
        if: env.HAS_KEY == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # "What's new": a merged PR's title (the commit message's third line), else its first line. Shown in the app.
          NEW="$(printf '%s\n' "$HEAD_MSG" | sed -n '3p')"; [ -n "$NEW" ] || NEW="$(printf '%s\n' "$HEAD_MSG" | sed -n '1p')"
          gh release delete android --yes --cleanup-tag || true
          gh release create android "$RUNNER_TEMP/MedTap.apk" --target "$GITHUB_SHA" --latest \
            --title "MedTap for Android (build ${{ github.run_number }})" \
            --notes "What's new: $NEW"$'\n\n'"Download MedTap.apk on your Android phone and open it to install. Updates install over the top and keep your data."
          gh release delete tapdose-android --yes --cleanup-tag || true
          gh release create tapdose-android "$RUNNER_TEMP/TapDose.apk" --target "$GITHUB_SHA" --latest=false \
            --title "TapDose for Android (build ${{ github.run_number }})" \
            --notes "What's new: $NEW"$'\n\n'"Download TapDose.apk on your Android phone and open it to install. Updates install over the top and keep your data."

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:native
      # Unsigned simulator build: proves the app and its native plugin compile. Installing on an iPhone needs an
      # Apple Developer account (see NATIVE.md).
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -50
        shell: bash -o pipefail {0}
