name: Deploy to GitHub Pages
# Tests and builds every branch; deploys only from the repository's default branch
# (GitHub Pages only accepts deployments from it).
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # PERMANENT: every tag has this address written on it (see src/nfc/url.ts).
      # The app lives at lumenbuild.github.io/MedTap/ for good. Renaming the repo or
      # adding a custom domain would move the site and break every tag already written.
      - name: Check the tag address still matches this site
        run: |
          if [ "${{ github.repository }}" != "lumenbuild/MedTap" ]; then
            echo "::error::The repo is now ${{ github.repository }}, but every tag points to https://lumenbuild.github.io/MedTap/. Rename it back, or every tag must be rewritten."
            exit 1
          fi
      - name: Build
        env:
          VITE_TAG_BASE: https://lumenbuild.github.io/MedTap/
          BASE_PATH: /MedTap/
        run: npm run build
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
