name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Set repo variable APP_DOMAIN (Settings > Variables) for the custom domain.
      # Without it, the site builds for username.github.io/<repo>/.
      - name: Build
        run: |
          if [ -n "${{ vars.APP_DOMAIN }}" ]; then
            echo "${{ vars.APP_DOMAIN }}" > public/CNAME
            # Every tag gets this address written on it permanently (src/nfc/url.ts).
            VITE_TAG_BASE=https://${{ vars.APP_DOMAIN }}/ BASE_PATH=/ npm run build
          else
            BASE_PATH=/${{ github.event.repository.name }}/ npm run build
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
