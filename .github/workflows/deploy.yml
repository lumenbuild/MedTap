name: Deploy to GitHub Pages
# Tests and builds every branch; deploys only from the repository's default branch
# (GitHub Pages only accepts deployments from it).
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Set repo variable APP_DOMAIN (Settings > Variables) for the custom domain.
      # Without it, the site builds for username.github.io/<repo>/.
      - name: Build
        run: |
          if [ -n "${{ vars.APP_DOMAIN }}" ]; then
            echo "${{ vars.APP_DOMAIN }}" > public/CNAME
            # Every tag gets this address written on it permanently (src/nfc/url.ts).
            VITE_TAG_BASE=https://${{ vars.APP_DOMAIN }}/ BASE_PATH=/ npm run build
          else
            BASE_PATH=/${{ github.event.repository.name }}/ npm run build
          fi
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
