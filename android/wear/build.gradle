// MedTap / TapDose for Wear OS: the next dose and as-needed buttons on the watch (app and tile), sending "log" taps to
// the phone app, which logs them. Same application ids and signing key as the phone apps, so they pair.
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.21'
    }
}
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "app.medtap.wear"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion 30
        targetSdkVersion 34
        versionCode Integer.parseInt(System.getenv('MEDTAP_VERSION_CODE') ?: '1')
        versionName System.getenv('MEDTAP_VERSION_NAME') ?: "1.0"
    }
    flavorDimensions = ["edition"]
    productFlavors {
        medtap { dimension "edition"; applicationId "app.medtap.tracker"; resValue "string", "app_name", "MedTap" }
        tapdose { dimension "edition"; applicationId "app.tapdose.tracker"; resValue "string", "app_name", "TapDose" }
    }
    signingConfigs {
        release {
            def ks = System.getenv('MEDTAP_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('MEDTAP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MEDTAP_KEY_ALIAS') ?: 'medtap'
                keyPassword System.getenv('MEDTAP_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('MEDTAP_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    buildFeatures { compose true }
    lint { abortOnError false }
    // Screenshots of the watch screens, rendered on the computer (see src/test).
    testOptions { unitTests { includeAndroidResources = true; all { systemProperty 'shots.dir', System.getProperty('shots.dir', "$buildDir/shots") } } }
}

dependencies {
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "androidx.wear.tiles:tiles:1.4.1"
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "androidx.wear.protolayout:protolayout-material:1.2.1"
    implementation "androidx.wear.watchface:watchface-complications-data-source:1.2.1"
    implementation "com.google.guava:guava:33.3.1-android"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.9.0"
    // The app's screens (Compose for Wear OS), the live countdown on the watch face, and heart rate.
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.wear.compose:compose-material:1.4.1"
    implementation "androidx.wear.compose:compose-foundation:1.4.1"
    implementation "androidx.wear.compose:compose-navigation:1.4.1"
    implementation "androidx.wear:wear-ongoing:1.0.0"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.health:health-services-client:1.0.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
