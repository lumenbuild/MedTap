apply plugin: 'com.android.application'

android {
    namespace = "app.medtap.tracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.medtap.tracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI sets these so each build installs over the last one.
        versionCode Integer.parseInt(System.getenv('MEDTAP_VERSION_CODE') ?: '1')
        versionName System.getenv('MEDTAP_VERSION_NAME') ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Four apps from one project (see src/edition.ts): MedTap (everything), TapDose (medications and ADHD support),
    // TapWeigh (weight, measurements, food) and TapLift (training). Each installs separately and opens only its own tags.
    // And two stores: github (the APKs on GitHub releases, which update themselves) and play (Google Play bundles: Play
    // does the updating, so the self-update and battery permissions are removed, see src/play/AndroidManifest.xml).
    // Build the matching web app first, e.g. `npm run build:native:tapweigh` then :app:assembleTapweighGithubRelease, or
    // `VITE_STORE=play npm run build:native:tapweigh` then :app:bundleTapweighPlayRelease.
    flavorDimensions = ["edition", "store"]
    productFlavors {
        medtap {
            dimension "edition"
            applicationId "app.medtap.tracker"
            manifestPlaceholders = [tagPath: "/MedTap/"]
        }
        tapdose {
            dimension "edition"
            applicationId "app.tapdose.tracker"
            manifestPlaceholders = [tagPath: "/MedTap/tapdose/"]
        }
        tapweigh {
            dimension "edition"
            applicationId "app.tapweigh.tracker"
            manifestPlaceholders = [tagPath: "/MedTap/tapweigh/"]
        }
        taplift {
            dimension "edition"
            applicationId "app.taplift.tracker"
            manifestPlaceholders = [tagPath: "/MedTap/taplift/"]
        }
        github { dimension "store" }
        play { dimension "store" }
    }
    // Release builds are signed with the keystore in MEDTAP_KEYSTORE (CI writes it from repository secrets).
    // Keep the same key forever: Android only installs an update signed with the key the app was first installed with.
    signingConfigs {
        release {
            def ks = System.getenv('MEDTAP_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('MEDTAP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MEDTAP_KEY_ALIAS') ?: 'medtap'
                keyPassword System.getenv('MEDTAP_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('MEDTAP_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The web app in assets/ must be the same edition and store as the app being built, or MedTap could ship TapDose's screens
// (or a Play bundle the self-updater).
android.applicationVariants.configureEach { variant ->
    def edition = variant.productFlavors.find { it.dimension == 'edition' }.name
    def store = variant.productFlavors.find { it.dimension == 'store' }.name
    def want = store == 'play' ? "${edition}+play" : edition
    def check = tasks.register("check${variant.name.capitalize()}Edition") {
        doLast {
            def f = file('src/main/assets/public/edition.txt')
            def built = f.exists() ? f.text.trim() : 'missing'
            if (built != want) {
                throw new GradleException("The web app in assets is '${built}', not '${want}'. Run " +
                    (store == 'play' ? 'VITE_STORE=play ' : '') + (edition == 'medtap' ? "npm run build:native" : "npm run build:native:${edition}") + " first.")
            }
        }
    }
    variant.preBuildProvider.configure { dependsOn check }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
